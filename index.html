<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="タスクの追加、完了、削除ができるシンプルなTODOリスト"
    />
    <title>TODOリスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800">
    <main class="mx-auto w-full max-w-2xl px-5 py-10 sm:px-8 sm:py-14" aria-labelledby="page-title">
      <header class="mb-7">
        <p class="mb-2 text-sm font-bold tracking-widest text-indigo-600">DOM操作・イベント</p>
        <h1 id="page-title" class="mb-3 text-4xl font-bold tracking-tight text-slate-900 sm:text-5xl">TODOリスト</h1>
        <p class="text-slate-500">今日やることを整理して、ひとつずつ片付けよう。</p>
      </header>

      <section class="rounded-2xl border border-slate-200 bg-white p-3 shadow-lg shadow-slate-200/60" aria-label="タスク追加">
        <label class="sr-only" for="todo-input">タスク</label>
        <div class="flex gap-3">
          <input
            id="todo-input"
            type="text"
            placeholder="タスクを入力..."
            maxlength="100"
            class="min-w-0 flex-1 rounded-xl border-0 bg-slate-50 px-4 py-3 outline-none ring-2 ring-transparent placeholder:text-slate-400 focus:ring-indigo-200"
          />
          <button
            id="add-button"
            type="button"
            class="rounded-xl bg-indigo-600 px-5 py-3 font-bold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-200"
          >追加</button>
        </div>
      </section>

      <section class="mt-8" aria-labelledby="task-heading">
        <div class="mb-3 flex items-center justify-between">
          <h2 id="task-heading" class="text-lg font-bold text-slate-900">タスク一覧</h2>
          <span id="task-count" class="text-sm text-slate-500">0件</span>
        </div>
        <p id="empty-message" class="rounded-xl border border-dashed border-slate-300 px-4 py-10 text-center text-slate-500">まだタスクがありません。</p>
        <ul id="todo-list" class="grid gap-3"></ul>
      </section>

      <footer class="mt-8 text-center text-xs text-slate-400">
        <p>完了したタスクは「完了」ボタンで切り替えられます。</p>
      </footer>
    </main>

    <script>
      const todoInput = document.querySelector("#todo-input");
      const addButton = document.querySelector("#add-button");
      const todoList = document.querySelector("#todo-list");
      const emptyMessage = document.querySelector("#empty-message");
      const taskCount = document.querySelector("#task-count");

      const updateSummary = () => {
        taskCount.textContent = todoList.children.length + "件";
      };

      const createTask = (text) => {
        const item = document.createElement("li");
        item.className = "flex items-center gap-3 rounded-xl border border-slate-200 bg-white p-4 shadow-sm";

        const taskText = document.createElement("span");
        taskText.className = "min-w-0 flex-1 break-words leading-6";
        taskText.textContent = text;

        const completeButton = document.createElement("button");
        completeButton.className = "rounded-lg bg-emerald-50 px-3 py-2 text-sm font-bold text-emerald-700 hover:bg-emerald-100 focus:outline-none focus:ring-4 focus:ring-emerald-100";
        completeButton.type = "button";
        completeButton.textContent = "完了";
        completeButton.addEventListener("click", () => {
          taskText.classList.toggle("line-through");
          taskText.classList.toggle("text-slate-400");
        });

        const deleteButton = document.createElement("button");
        deleteButton.className = "rounded-lg bg-rose-50 px-3 py-2 text-sm font-bold text-rose-700 hover:bg-rose-100 focus:outline-none focus:ring-4 focus:ring-rose-100";
        deleteButton.type = "button";
        deleteButton.textContent = "削除";
        deleteButton.addEventListener("click", () => {
          item.remove();
          if (todoList.children.length === 0) {
            emptyMessage.classList.toggle("hidden");
          }
          updateSummary();
        });

        item.appendChild(taskText);
        item.appendChild(completeButton);
        item.appendChild(deleteButton);
        todoList.appendChild(item);
      };

      addButton.addEventListener("click", () => {
        const text = todoInput.value.trim();
        if (text === "") {
          return;
        }

        createTask(text);
        todoInput.value = "";
        if (todoList.children.length === 1) {
          emptyMessage.classList.toggle("hidden");
        }
        updateSummary();
      });

      updateSummary();
    </script>
  </body>
</html>
