<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="タスクの追加、完了、削除ができるシンプルなTODOリスト"
    />
    <title>TODOリスト</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="todo-app" aria-labelledby="page-title">
      <header class="app-header">
        <p class="eyebrow">DOM操作・イベント</p>
        <h1 id="page-title">TODOリスト</h1>
        <p class="intro">今日やることを整理して、ひとつずつ片付けよう。</p>
      </header>

      <form id="todo-form" class="todo-form">
        <label class="sr-only" for="todo-input">タスク</label>
        <input
          id="todo-input"
          type="text"
          placeholder="タスクを入力..."
          autocomplete="off"
          maxlength="100"
        />
        <button class="add-button" type="submit">追加</button>
      </form>

      <section class="task-section" aria-labelledby="task-heading">
        <div class="section-heading">
          <h2 id="task-heading">タスク一覧</h2>
          <span id="task-count" class="task-count">0件</span>
        </div>
        <p id="empty-message" class="empty-message">まだタスクがありません。</p>
        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      </section>

      <footer class="app-footer">
        <p>完了したタスクは「完了」ボタンで切り替えられます。</p>
      </footer>
    </main>
  </body>
</html>
